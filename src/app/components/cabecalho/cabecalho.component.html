<header class="header">
    <div class="logo-container">
        <i class="fa-solid fa-book-open logo-icon"></i>
        <span class="logo-texto">Gestão de Biblioteca</span>
    </div>

    <div class="busca-container">
        <input type="text" placeholder="Buscar..." class="busca-input">
        <i class="fa-solid fa-magnifying-glass busca-icon"></i>
    </div>

    <nav class="menu-navegacao">
        <a routerLink="/dashboard" routerLinkActive="ativo">Dashboard</a>
        <a routerLink="/acervo" routerLinkActive="ativo">Acervo</a>
        <a routerLink="/emprestimos" routerLinkActive="ativo">Empréstimos</a>
        <a routerLink="/usuarios" routerLinkActive="ativo">Usuários</a>
    </nav>

    <!-- Pílula do Perfil / Login -->
    <div class="perfil-wrapper">
        <div class="perfil-container" (click)="toggleMenu()">
            <span class="usuario-nome">{{ usuarioLogado || 'Login' }}</span>
            <i class="fa-solid fa-chevron-down seta-icon"></i>
        </div>

        <!-- Menu suspenso (Dropdown) que abre ao clicar -->
        <div class="dropdown-menu" *ngIf="menuAberto">
            <a routerLink="/perfil" (click)="menuAberto = false" class="dropdown-item">
                <i class="fa-solid fa-user"></i> Meu Perfil
            </a>
            <button (click)="logout()" class="dropdown-item logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>
</header>
