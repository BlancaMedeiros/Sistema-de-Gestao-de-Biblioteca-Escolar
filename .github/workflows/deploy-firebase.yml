name: Validar e publicar no Firebase

on:
  push:
    branches:
      - feat/backend-foundation
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-feat-backend-foundation
  cancel-in-progress: false

env:
  PROJECT_ID: projeto-integrador-2-6352b
  REGION: southamerica-east1
  ARTIFACT_REPOSITORY: biblioteca-containers
  CLOUD_RUN_SERVICE: biblioteca-api
  WORKLOAD_IDENTITY_PROVIDER: projects/143830170491/locations/global/workloadIdentityPools/github-actions-biblioteca/providers/github-repository
  DEPLOY_SERVICE_ACCOUNT: biblioteca-github-deployer@projeto-integrador-2-6352b.iam.gserviceaccount.com

jobs:
  validar:
    name: Build do frontend e backend
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci --prefix backend

      - name: Compilar backend
        run: npm run build --prefix backend

      - name: Instalar dependências do frontend
        run: npm ci --prefix frontend

      - name: Compilar frontend
        run: npm run build --prefix frontend

  publicar:
    name: Publicar Cloud Run e Firebase Hosting
    needs: validar
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - id: auth
        name: Autenticar no Google Cloud via OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Gerar e publicar imagem do backend
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}
        run: |
          gcloud builds submit backend \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}"

      - name: Atualizar o Cloud Run
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI}:${GITHUB_SHA}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --quiet

      - name: Publicar o Firebase Hosting
        run: npx --yes firebase-tools@15.30.2 deploy --only hosting --project "${PROJECT_ID}" --non-interactive

      - name: Verificar a publicação pública
        run: |
          for path in / /api/health /api/ready; do
            curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 \
              "https://${PROJECT_ID}.web.app${path}"
          done
